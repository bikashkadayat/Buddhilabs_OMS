# Ingress server block for the biometric attendance dashboard.
#
# The dashboard (morx) serves from / with ABSOLUTE /assets and /api/data paths,
# so it cannot share nif-web's origin (those collide with the SPA's own /assets
# and the /api -> Django proxy). It therefore needs its OWN hostname, routed
# straight to the nif-biometric container on :8765.
#
# This is a REFERENCE block for the shared ingress nginx (nifn-nginx-website,
# owned by the NIFN_website stack) — the same nginx that already fronts
# nif-web:80. Add it there, point DNS/Cloudflare at it, then set
# VITE_BIOMETRIC_URL=https://<this hostname> in .env before building the `web`
# image (docker-compose.prod.yml). Replace attendance.example.com with your host.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ SECURITY: the morx dashboard has NO authentication of its own. On a public
# hostname it exposes every employee's attendance to anyone with the URL. Do NOT
# ship it open. Put access control in FRONT of it — pick one:
#   • Cloudflare Access / Zero Trust (SSO) on this hostname  ← recommended
#   • an IP allowlist (allow office egress; deny all) — the `allow/deny` lines
#   • nginx basic auth (auth_basic) — works, but the browser prompts inside the
#     embedded iframe, so it is clunky for the admin SPA.
# ─────────────────────────────────────────────────────────────────────────────

# HTTP -> HTTPS (skip if Cloudflare already forces HTTPS to the origin).
server {
    listen 80;
    listen [::]:80;
    server_name attendance.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attendance.example.com;

    ssl_certificate     /etc/letsencrypt/live/attendance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Access control (see the SECURITY note above) — uncomment ONE. ---
    # IP allowlist:
    #   allow 203.0.113.0/24;   # office egress
    #   deny  all;
    # Basic auth:
    #   auth_basic           "Biometric Attendance";
    #   auth_basic_user_file /etc/nginx/.htpasswd-biometric;

    location / {
        # nif-biometric is reached by container name over the shared docker
        # network the ingress nginx is on (same as nif-web:80). If your ingress
        # runs on the HOST instead, publish the port and proxy to 127.0.0.1.
        proxy_pass http://nif-biometric:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
