# Container nginx for the production stack (docker-compose.prod.yml).
# Serves the pre-built SPA and reverse-proxies the API to Gunicorn over plain
# HTTP on :80. TLS is terminated by the HOST nginx (or Cloudflare) sitting in
# front of this container — see docs/DEPLOYMENT.md for the host vhost example.
#
# This file is copied to /etc/nginx/conf.d/default.conf (http context), so the
# map directives below are valid here.

# Preserve the scheme/host the upstream TLS proxy forwarded; fall back to this
# hop's own values when the proxy didn't set them. Django reads X-Forwarded-Proto
# (SECURE_PROXY_SSL_HEADER) and X-Forwarded-Host (USE_X_FORWARDED_HOST), so the
# host proxy MUST send `X-Forwarded-Proto https` or Django will 301-redirect-loop.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ''      $host;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Match Django's upload limits (attachment / profile-photo POSTs).
    client_max_body_size 25m;

    # Hashed, immutable Vite build assets — cache hard. These are the SPA's own
    # JS/CSS under /assets/, distinct from Django's /static/ (served by Gunicorn).
    location /assets/ {
        root /srv;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket for live attendance. Needs its own block: the API block below
    # does not forward Upgrade/Connection, and its 120s read timeout would drop
    # an idle socket every two minutes.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $fwd_proto;
        proxy_set_header X-Forwarded-Host   $fwd_host;
        # Long-lived by design; the client also heartbeats.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        # Nothing to cache, and buffering would defeat the point.
        proxy_buffering off;
    }

    # ZKTeco iClock / PUSH endpoints -> Gunicorn.
    #
    # This block is not optional and must sit BEFORE `location /`. Without it
    # /iclock/cdata falls through to the SPA fallback and the terminal receives
    # 200 OK with an HTML page. Firmware that treats any 200 as success then
    # deletes the punches it just sent — attendance destroyed, silently, with
    # nothing in any log to show for it.
    #
    # Paths are fixed by the device firmware, so they cannot be moved under
    # /api/. The device speaks plain HTTP and cannot follow a redirect to TLS,
    # which is why Django also exempts this prefix from SECURE_SSL_REDIRECT.
    #
    # SECURITY: the iClock protocol has no authentication — a terminal
    # identifies itself with ?SN=<serial> and nothing more. Do NOT expose this
    # location to the internet. If this nginx is internet-facing, restrict it:
    #
    #     allow 192.168.77.0/24;
    #     deny  all;
    #
    location /iclock/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $fwd_host;
        proxy_read_timeout 60s;
    }

    # API, Django admin, and Django-served static/media -> Gunicorn.
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $fwd_host;
        proxy_read_timeout 120s;
    }

    # Everything else: the built SPA, with client-side routing fallback.
    location / {
        root /srv;
        try_files $uri /index.html;
    }
}
