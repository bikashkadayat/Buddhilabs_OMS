[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
# Channels consumers are async; asyncio_mode=auto lets async test functions run
# without decorating every one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    slow: seeds tens of thousands of rows to measure query-count stability at scale.
    qa: regenerates the browser QA fixtures; writes outside the backend tree.
# Scale tests and the QA fixture generator are DESELECTED by default:
# minutes/tests/test_performance.py seeds 16000 rows per test, which would add several
# minutes to every ordinary run and get the file deleted; test_qa_fixture.py writes into
# frontend/qa/, which no ordinary test run should do. Run them deliberately:
#
#     pytest -m slow -s minutes/tests/test_performance.py
#     pytest -m qa minutes/tests/test_qa_fixture.py
#
# A command-line -m overrides this one, which is what makes that work.
addopts = -m "not slow and not qa"
